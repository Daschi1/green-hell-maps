<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="-JXDzBf7cjq9n7scSuOIpyD4VPE-1PYaV611k0NwbwA" />
    <script defer src="https://assets.onedollarstats.com/stonks.js"></script>

    <!-- Light mode favicon (Safari and IE don't support svg favicons) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon-black.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/favicon-black.png"
      media="(prefers-color-scheme: light)"
    />
    <!-- Dark mode favicon (Safari and IE don't support svg favicons) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon-white.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/favicon-white.png"
      media="(prefers-color-scheme: dark)"
    />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="dark:bg-gray-900">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
